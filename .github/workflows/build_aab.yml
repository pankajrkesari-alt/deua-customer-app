name: Build Customer AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Android files
        run: flutter create --platforms=android --org com.deuafresh --project-name deua_customer .

      - name: Add Internet Permission
        run: |
          python3 -c '
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p).read()
          perm = "<uses-permission android:name=\"android.permission.INTERNET\"/>"
          if perm not in s:
              s = s.replace("<application", perm + "\n    <application", 1)
              open(p, "w").write(s)
          '

      - name: Generate Release Signing Key
        run: |
          keytool -genkey -v \
            -keystore android/app/upload-keystore.jks \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias upload \
            -storepass DeuaFresh@2026 \
            -keypass DeuaFresh@2026 \
            -dname "CN=DEUA FRESH, OU=App, O=DEUA FRESH, L=Deua, ST=Bihar, C=IN"

      - name: Configure Release Signing
        run: |
          python3 -c '
          p = "android/app/build.gradle.kts"
          s = open(p).read()
          signing_block = """    signingConfigs {
                  create("release") {
                      keyAlias = "upload"
                      keyPassword = "DeuaFresh@2026"
                      storeFile = file("upload-keystore.jks")
                      storePassword = "DeuaFresh@2026"
                  }
              }

              buildTypes {"""
          s = s.replace("    buildTypes {", signing_block, 1)
          s = s.replace("signingConfig = signingConfigs.getByName(\"debug\")", "signingConfig = signingConfigs.getByName(\"release\")")
          open(p, "w").write(s)
          '

      - name: Get dependencies
        run: flutter pub get

      - name: Build Signed AAB
        run: flutter build appbundle --release

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DEUA-Customer-PlayStore-AAB
          path: build/app/outputs/bundle/release/app-release.aab

      - name: Upload Signing Key (Save in Google Drive)
        uses: actions/upload-artifact@v4
        with:
          name: DEUA-Signing-Key-SAFE-RAKHEIN
          path: android/app/upload-keystore.jks
